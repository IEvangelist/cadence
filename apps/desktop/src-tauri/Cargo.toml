[package]
name = "cadence-desktop"
version = "0.1.0"
description = "Cadence desktop shell (Tauri) that loads the Cadence web SPA."
authors = ["Cadence contributors"]
license = "MIT"
repository = "https://github.com/IEvangelist/cadence"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cadence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
log = "=0.4.33"
tauri = { version = "=2.11.5" }
tauri-plugin-log = "=2.9.0"
