version: 2
# Keeps SHA-pinned GitHub Actions and package dependencies current.
# Dependabot rewrites the pinned SHA and updates the trailing "# vX.Y.Z" comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      web:
        patterns: ["*"]

  # Isolated landing + docs site (own lockfile, not in the root workspaces).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["*"]
