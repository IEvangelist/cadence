version: 2
# Keeps SHA-pinned GitHub Actions and package dependencies current.
# Dependabot rewrites the pinned SHA and updates the trailing "# vX.Y.Z" comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      web:
        patterns: ["*"]
    # Keep TensorFlow.js on the 2.x line. @magenta/music@1.23.1 (the latest
    # published Magenta) constrains its peer to @tensorflow/tfjs ^2.7.0, so a
    # major bump (4.x) breaks Magenta model loading in the AI assistant.
    # Decline these per docs/versioning-policy.md ("Exception: @tensorflow/tfjs
    # pinned to 2.8.6").
    ignore:
      - dependency-name: "@tensorflow/tfjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tensorflow/tfjs-backend-webgl"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["*"]
