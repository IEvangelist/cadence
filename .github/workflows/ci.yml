name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which stacks are present so the pipeline stays green as the
  # monorepo fills in during Phase 0.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      dotnet: ${{ steps.f.outputs.dotnet }}
      desktop: ${{ steps.f.outputs.desktop }}
      site: ${{ steps.f.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        shell: bash
        run: |
          set -euo pipefail
          web=false;     [ -f apps/web/package.json ] && web=true
          desktop=false; [ -f apps/desktop/src-tauri/Cargo.toml ] && desktop=true
          dotnet=false;  find . -name '*.sln' -o -name '*.slnx' | grep -q . && dotnet=true || true
          site=false;    [ -f site/package.json ] && site=true
          {
            echo "web=$web"
            echo "dotnet=$dotnet"
            echo "desktop=$desktop"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - run: npm run test:bundle-size --workspace @cadence/web
      # Vitest v8 coverage with enforced thresholds (see apps/web/vite.config.ts).
      # The run fails if lines/functions/branches/statements drop below 80%.
      - run: npm run test:coverage --if-present
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-bundle-size
          path: apps/web/test-results/final-gate/bundle-size-report.json
          if-no-files-found: ignore

  # End-to-end smoke + accessibility. Playwright builds the SPA and serves the
  # production bundle via `vite preview` (see apps/web/playwright.config.ts),
  # then runs the smoke suite (asserts the built app renders) and the axe-core
  # a11y suite (WCAG 2.1 A/AA).
  web-e2e:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (Chromium + OS deps)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e (smoke + a11y)
        working-directory: apps/web
        run: npm run e2e:final-gate
      - name: Run final UX visual comparisons
        working-directory: apps/web
        run: |
          npm run test:visual-baselines
          npm run e2e:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-visual
            apps/web/test-results/final-gate/audit-summary.json
          if-no-files-found: ignore

  # Landing + docs site: an isolated Astro project under site/ with its OWN
  # package.json + lockfile (deliberately NOT part of the root npm workspaces, so
  # it never touches apps/web or the root lockfile). Always builds on every PR so
  # breakage is caught without needing Pages or cloud creds, then runs the
  # Playwright suite against the built site: axe accessibility (WCAG 2.0/2.1 A/AA)
  # on the landing + docs pages, a responsive no-overflow check across
  # mobile/tablet/desktop, and an internal link + asset crawl. Publishing to
  # Pages is handled separately (and gated) in pages.yml.
  site:
    needs: detect
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Install Playwright (Chromium + OS deps)
        run: npx playwright install --with-deps chromium
      - name: Run a11y + responsive + link checks
        run: npm test
      - name: npm audit (full report, informational)
        run: npm audit || true
      # Gate at critical only: the site inherits the same pre-existing high
      # advisory as apps/web (nanoid via vite -> postcss, GHSA-2v37-7h3g-55p8),
      # which has no compatible fix; it is surfaced above but does not block.
      - name: npm audit (gate on critical)
        run: npm audit --audit-level=critical
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-playwright-report
          path: site/playwright-report
          if-no-files-found: ignore

  pages-artifact:
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix site
      - name: Test artifact assembly
        run: npm run test:pages-artifact
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate deployed paths, boot, fallback, and offline PWA
        run: npm run e2e:pages --workspace @cadence/web

  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    # ContinuousIntegrationBuild=true switches Directory.Build.props into
    # locked-mode restore (fail on stale/inconsistent packages.lock.json) and
    # enables deterministic assembly output. GitHub Actions does not set this
    # MSBuild property automatically, so we set it explicitly for the job.
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests (Category=Integration) boot containers via Aspire and
      # run in the dedicated dotnet-integration job; exclude them from the fast
      # unit run. xUnit's `!=` also matches tests with no Category trait.
      - run: dotnet test --no-build -c Release --filter "Category!=Integration" --logger trx --results-directory ./TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-test-results
          path: ./TestResults
          if-no-files-found: ignore

  # .NET line/method coverage gate (coverlet.msbuild). The >= 80% threshold is
  # configured in tests/Cadence.Api.Tests.csproj and enforced on a fresh build.
  dotnet-coverage:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Cadence.Api.Tests -c Release /p:CollectCoverage=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-coverage
          path: tests/Cadence.Api.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: ignore

  # Backend integration tests: Aspire.Hosting.Testing boots the AppHost
  # (API + Postgres/Redis/Blob) and asserts /health, /alive, /api/info and the
  # OpenAPI document. ubuntu-latest ships Docker, which Aspire needs to start
  # the backing resources.
  dotnet-integration:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Cadence.Api.IntegrationTests -c Release --filter "Category=Integration" --logger trx --results-directory ./TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-integration-results
          path: ./TestResults
          if-no-files-found: ignore

  # CodeQL static analysis (JavaScript/TypeScript). Uploading results to code
  # scanning requires GitHub Advanced Security, which is only available on public
  # repos here; the scan always runs and the SARIF is kept as an artifact, while
  # upload is gated on visibility so this stays green on the private repo and
  # lights up automatically if it goes public.
  codeql-web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
          output: sarif-results-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-web-sarif
          path: sarif-results-web
          if-no-files-found: ignore

  # CodeQL static analysis (C#). build-mode: manual because CodeQL's autobuild
  # is unreliable on .NET 10; we compile the product assemblies explicitly so the
  # extractor observes them. Upload gating matches codeql-web.
  codeql-dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          build-mode: manual
      # Building Cadence.Api compiles Cadence.ServiceDefaults transitively, which
      # covers the hand-written product code. The AppHost is deployment infra and
      # pulls RID-specific packages, so it is intentionally not built here.
      - name: Build for CodeQL
        run: dotnet build src/Cadence.Api/Cadence.Api.csproj -c Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:csharp"
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
          output: sarif-results-dotnet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-dotnet-sarif
          path: sarif-results-dotnet
          if-no-files-found: ignore

  # Dependency review on PRs. This repository's Dependency Graph API is not
  # currently accessible to the action (it exits "Dependency review is not
  # supported on this repository"), which previously hard-failed the job and put
  # a red X on every single PR even though nothing was wrong. The job is kept for
  # its value if the graph is ever enabled, but is now non-blocking:
  #   - continue-on-error keeps the check green regardless of the outcome, and
  #   - warn-only downgrades any real findings to warnings (no hard fail) if the
  #     graph becomes available later.
  # npm audit + NuGet audit remain the hard vulnerability gate that runs on every
  # build, so security coverage is unaffected by this being advisory-only.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
          warn-only: true

  # Secret scanning. A SHA-pinned gitleaks binary (no marketplace action) scans
  # the working tree and fails the job if any committed secret is detected.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # npm supply-chain audit. Surfaces the full advisory report (informational),
  # then gates the build at critical severity. A single pre-existing high
  # advisory (nanoid via vite -> postcss, GHSA-2v37-7h3g-55p8) has no compatible
  # fix in the 3.3.x line; it is surfaced but does not block. See docs/testing.md.
  npm-audit:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (full report, informational)
        run: npm audit || true
      - name: npm audit (gate on critical)
        run: npm audit --audit-level=critical

  desktop:
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tauri's generate_context! macro embeds apps/web/dist at compile time,
      # so the SPA must be built before cargo clippy runs.
      - run: npm run build --workspace @cadence/web
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (stable)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
