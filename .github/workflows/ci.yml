name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which stacks are present so the pipeline stays green as the
  # monorepo fills in during Phase 0.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      dotnet: ${{ steps.f.outputs.dotnet }}
      desktop: ${{ steps.f.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        shell: bash
        run: |
          set -euo pipefail
          web=false;     [ -f apps/web/package.json ] && web=true
          desktop=false; [ -f apps/desktop/src-tauri/Cargo.toml ] && desktop=true
          dotnet=false;  find . -name '*.sln' -o -name '*.slnx' | grep -q . && dotnet=true || true
          {
            echo "web=$web"
            echo "dotnet=$dotnet"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory ./TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-test-results
          path: ./TestResults
          if-no-files-found: ignore

  desktop:
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tauri's generate_context! macro embeds apps/web/dist at compile time,
      # so the SPA must be built before cargo clippy runs.
      - run: npm run build --workspace @cadence/web
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
